# 1. Expand the tilde (~) to the full path if it fails, 
# but the new parser prefers absolute paths.
preload = ~/Pictures/desktop.png

# 2. Use the new block syntax for better compatibility with the v0.53 IPC
wallpaper {
    monitor = eDP-1
    path = ~/Pictures/desktop.png
    fit_mode = contain
}

wallpaper {
    monitor = HDMI-A-1
    path = ~/Pictures/desktop.png
    fit_mode = contain
}

# 3. Enable IPC if you want to change wallpapers dynamically via scripts
ipc = off

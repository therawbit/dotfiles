source = $HOME/.config/hypr/mocha.conf

$accent = $graphitedark
$accentAlpha = $graphitedarkAlpha
$font = JetBrainsMono NF

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    path = ~/Pictures/desktop-blur.png
    monitor =
    blur_size = 0
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 90
    font_family = $font
    position = 30, 40
    halign = left
    valign = bottom
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = 30, 0
    halign = left
    valign = bottom
}

# USER AVATAR

image {
    monitor = 
    path = ~/Pictures/pp.png
    size = 180
    border_color = $accent

    position = 0, 120
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $graphitewhite
    font_color = $graphitedark
    fade_on_empty = false
    placeholder_text = <span foreground="##$accentAlpha"><i>󰌾 </i><span foreground="##$accentAlpha"><b>$USER</b></span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -35
    halign = center
    valign = center
}
